<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Red | Juega y Gana</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fc; }
        .navbar-custom { background-color: #ffffff; border-bottom: 1px solid #eaeaea; }
        .brand-text { color: #3b3b98; font-weight: 800; font-size: 1.4rem; letter-spacing: -0.5px; }
        .brand-icon { color: #0d6efd; font-size: 1.6rem; vertical-align: middle; margin-right: 5px; }
        .nav-link { color: #555; font-weight: 500; transition: 0.2s; }
        .nav-link:hover { color: #3b3b98; }
        .btn-register-nav { background-color: #5a54d8; color: white; border-radius: 8px; font-weight: 500; padding: 8px 20px; transition: 0.3s; }
        .btn-register-nav:hover { background-color: #4843b8; color: white; }
        .divider-vertical { border-left: 2px solid #eaeaea; height: 24px; margin: 0 15px; align-self: center; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <i class="bi bi-heptagon-fill brand-icon"></i>
                <span class="brand-text">BingoRed</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link px-3" href="/">Inicio</a></li>
                    
                    {% if user.is_authenticated %}
                        <li class="nav-item"><a class="nav-link px-3" href="{% url 'bingo_lobby' %}">Salas de Bingo</a></li>
                        <div class="divider-vertical d-none d-lg-block"></div>
                        <li class="nav-item">
                            <a class="nav-link text-dark fw-bold" href="#"><i class="bi bi-person-circle text-primary"></i> {{ user.username }}</a>
                        </li>
                        <li class="nav-item ms-lg-2">
                            <a class="btn btn-danger btn-sm rounded-3 fw-bold px-3 py-2" href="{% url 'logout' %}">Salir</a>
                        </li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link px-3" href="/#eventos">Bingos</a></li>
                        <div class="divider-vertical d-none d-lg-block"></div>
                        <li class="nav-item"><a class="nav-link px-3" href="{% url 'signin' %}">Ingresar</a></li>
                        <li class="nav-item ms-lg-2">
                            <a class="btn btn-register-nav shadow-sm" href="{% url 'signup' %}">Registrarme</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
